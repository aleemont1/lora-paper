name: Build and publish Latex

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    name: Build PDF
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Compile paper PDF
        uses: xu-cheng/latex-action@3.2.0
        with:
          root_file: paper.tex
          work_in_root_file_dir: true
      - name: Compile supplementary PDF
        if: hashFiles('supplementary.tex') != ''
        uses: xu-cheng/latex-action@3.2.0
        with:
          root_file: supplementary.tex
          work_in_root_file_dir: true
      - name: Generate build artifact (PDF)
        uses: actions/upload-artifact@v4
        with:
          name: build-pdf
          path: |
            paper.pdf
            supplementary.pdf
          if-no-files-found: warn

  build-html:
    runs-on: ubuntu-latest
    name: Build HTML
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Compile paper and supplementary HTML
        uses: xu-cheng/texlive-action@v2
        with:
          scheme: full
          run: |
            make4ht -u paper.tex "mathjax,htmlex" && bibtex paper && make4ht -u paper.tex "mathjax,htmlex"
            if [ -f supplementary.tex ]; then
              make4ht -u supplementary.tex "mathjax,htmlex" || true
              (bibtex supplementary || true)
              make4ht -u supplementary.tex "mathjax,htmlex" || true
            fi
      - name: Prepare deployment artifact
        run: |
          mkdir site
          # Landing page and shared assets (style, fonts, favicon) live in web/.
          cp -r web/. site/
          cp paper.html site/paper.html
          [ -f paper.css ] && cp paper.css site/paper.css
          [ -f paper.bib ] && cp paper.bib site/paper.bib
          [ -f supplementary.html ] && cp supplementary.html site/supplementary.html
          [ -f supplementary.css ] && cp supplementary.css site/supplementary.css
          [ -d img ] && cp -r img/ site/
          cp *.svg site/ 2>/dev/null || true
          # Give the generated HTML the aleemont.dev look: type, width, colours,
          # favicon and a bar back to the landing page.
          for doc in paper supplementary; do
            [ -f "site/$doc.html" ] || continue
            [ -f "site/$doc.css" ] && cat web/aleemont-doc.css >> "site/$doc.css"
            perl -0pi -e 's#</head>#<link rel="icon" href="favicon.svg" type="image/svg+xml">\n</head>#; s#<body\s*>#<body>\n<nav class="aleemont-bar"><a href="https://aleemont.dev/">Alessandro Monticelli</a><a href="./">LAMP paper</a><a href="pdf/'"$doc"'.pdf">PDF</a></nav>#' "site/$doc.html"
          done

      - name: Generate build artifact (HTML)
        uses: actions/upload-artifact@v4
        with:
          name: build-html
          path: site

  deploy:
    name: Deploy PDF and HTML
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build-pdf, build-html]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: build-pdf
          path: site/pdf
      - name: Download HTML artifact
        uses: actions/download-artifact@v4
        with:
          name: build-html
          path: site/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
